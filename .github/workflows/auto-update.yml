name: Auto Update
on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28 # v25
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Flake Inputs
        run: nix flake update

      - name: Check for flake.lock changes
        id: check
        run: |
          if git diff --quiet flake.lock; then
            echo "No changes in flake.lock, skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "flake.lock changed, proceeding with update."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Kernel Hash and Patch Lists
        id: sync
        if: steps.check.outputs.changed == 'true'
        run: |
          SOURCE_PATH=$(nix eval --impure --raw .#repo-src.outPath)
          echo "Source path found at: $SOURCE_PATH"

          VER=$(grep "_mt76_kver=" "$SOURCE_PATH/PKGBUILD" | cut -d"'" -f2)

          if [ -z "$VER" ]; then
            echo "Error: Could not extract version from PKGBUILD"
            exit 1
          fi
          echo "Detected Target Kernel Version: $VER"

          chmod +x ./update.sh
          ./update.sh "$VER" "$SOURCE_PATH"

          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN opens this pull request only while Settings, Actions, General allows GitHub Actions to create
      # pull requests; with that box unticked the step fails and nothing is updated.
      - name: Open or Update the Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: auto-update
          delete-branch: true
          add-paths: |
            versions.json
            flake.lock
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'chore: auto-update to v${{ steps.sync.outputs.VERSION }}'
          title: 'chore: auto-update to v${{ steps.sync.outputs.VERSION }}'
          body: Updates `flake.lock` and `versions.json` from the hourly Auto Update run.
